name: gates

# Every gate that a clean checkout can actually run. Verified by cloning
# this repository to an empty directory and running each step there.
#
# Deliberately NOT here:
#   - zig build llama-adapter and zig build kt-adapter need sibling
#     checkouts outside this repository (../llama.cpp and
#     ../ktransformers-zig, the latter already built with its own
#     zig build). A fresh CI runner has neither, and cloning ktransformers
#     would drag in a torch toolchain. They stay local integration gates.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # El gate de portabilidad cuesta un `zig build test` entero para un segundo
    # destino, asi que no va en cada push. Va aqui, programado, y NO bloquea:
    # informa, y cuando alguien arregle uno de los ficheros fijados la lista
    # se queda vieja y este job lo dice. Un job que corre y falla sin bloquear
    # sigue siendo una puerta; un protocolo sin fecha no es nada.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: fmt, tests, ABI, FRI audit, vLLM adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The project is pinned to one Zig and builds against nothing else,
      # so the version is read from ziglang.org's own index rather than
      # guessed: no third-party setup action, and the tarball's sha256
      # comes from the same document that named it.
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          version=0.16.0
          curl -fsSL https://ziglang.org/download/index.json -o /tmp/zig-index.json
          url=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['$version']['x86_64-linux']['tarball'])")
          shasum=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['$version']['x86_64-linux']['shasum'])")
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "$shasum  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          zig version
          python3 --version

      # The auditor implements BLAKE3 against the PyPI package while the
      # library uses std.crypto.hash.Blake3, so a genuine disagreement between
      # the two implementations is what the audit is for. That makes the
      # package a hard requirement, not an optional extra: without it the
      # auditor exits 2 and `zig build verify` fails.
      #
      # Pinned so a new PyPI release cannot silently change the auditor. The
      # three attempts cover the runner images that mark the system
      # interpreter as externally managed (PEP 668); the import check below
      # fails the step loudly if none of them worked.
      - name: Python audit dependency
        run: |
          python3 -m pip install --disable-pip-version-check blake3==1.0.9 \
            || python3 -m pip install --disable-pip-version-check --break-system-packages blake3==1.0.9 \
            || python3 -m pip install --disable-pip-version-check --user blake3==1.0.9
          python3 -c "import blake3; print('blake3', blake3.__version__)"

      - name: Formatting
        run: zig build fmt

      - name: Unit tests
        run: zig build test --summary all

      - name: C ABI end to end
        run: zig build abi

      - name: Tests + ABI + independent Python audit
        run: zig build verify

      - name: FRI v2 audit
        run: zig build spike

      - name: vLLM ctypes adapter
        run: zig build vllm-adapter

      - name: The suite really ran
        run: |
          # A build step that silently runs zero tests would still be
          # green, so the count is asserted rather than trusted.
          #
          # A FLOOR, not equality. An earlier version pinned the exact count,
          # and it was wrong within a day: four tests were added, the pin was
          # not updated, and CI went red on a commit whose only sin was normal
          # work.
          #
          # The failure this step exists to catch is LOSS — a suite that stops
          # being collected, a `refAllDecls` that goes missing, a module
          # disconnected from the root. That has happened in this ecosystem
          # (the binius re-exports; five channel.zig tests that never
          # compiled). Adding tests is not a failure mode, so equality only
          # produces noise: every new test breaks the gate and someone has to
          # edit a file. Raising the floor is a deliberate act, not a
          # synchronisation chore.
          #
          # Three digits, so a suite of nine cannot pass, and a loss of more
          # than 20% cannot pass either. That gap is the buffer:
          # raising the floor is deliberate, but shrinking it is a regression.
          zig build test --summary all 2>&1 | tee /tmp/summary.txt
          grep -Eq '2[0-9]{2}/2[0-9]{2} tests passed' /tmp/summary.txt

  # NO bloqueante a proposito, pero NO por ser poco importante: las dos
  # preguntas son distintas y las dos merecen una puerta.
  #
  # wasm-consumer es la que responde si un incrustado puede compilar para
  # wasm32-freestanding. Es la que muerde, y se ha visto ponerse roja con el
  # defecto que nombra: std.heap.smp_allocator en libs/api.zig, que no existe
  # sin hilos. Antes este job solo corria el inventario, de modo que la
  # pregunta que si importa no se ejecutaba en ningun sitio.
  #
  # wasm-test-sweep es el inventario: que ficheros fallan todavia bajo
  # `zig build test -Dtarget=wasm32-freestanding`, contra
  # tools/wasm_test_sweep_expected.txt. Si este job se pone rojo, el conjunto
  # cambio: alguien arreglo algo, o aparecio un problema nuevo.
  wasm-portability:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # La del consumidor primero: es la que responde por la web.
      - run: zig build wasm-consumer
      - run: bash tools/wasm_portability.sh

  # Los tres diferenciales. NO bloqueantes, y por el mismo motivo que el job de
  # arriba: su salida es una tabla, no un veredicto sobre el codigo bajo prueba.
  # Pero hasta ahora eran guiones sin entrada en build.zig y sin job, asi que su
  # resultado vivia en el mensaje de un commit y nadie lo repetia. Entre los tres
  # tomaron las dos decisiones mayores del repositorio — 176 lineas de campo y 828
  # de FRI — de modo que su alcance importa mas que su cuenta.
  #
  # tools/pin_dir.sh desempaqueta el pin desde la cache global de Zig a partir del
  # hash de build.zig.zon, asi que un checkout limpio no necesita nada a mano.
  differentials:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build field-diff
      - run: zig build domain-cost
      - run: zig build fri-conv-diff
      - run: zig build fri-diff
