name: gates

# Every gate that a clean checkout can actually run. Verified by cloning
# this repository to an empty directory and running each step there.
#
# Deliberately NOT here:
#   - zig build llama-adapter and zig build kt-adapter need sibling
#     checkouts outside this repository (../llama.cpp and
#     ../ktransformers-zig, the latter already built with its own
#     zig build). A fresh CI runner has neither, and cloning ktransformers
#     would drag in a torch toolchain. They stay local integration gates.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: fmt, tests, ABI, FRI audit, vLLM adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The project is pinned to one Zig and builds against nothing else,
      # so the version is read from ziglang.org's own index rather than
      # guessed: no third-party setup action, and the tarball's sha256
      # comes from the same document that named it.
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          version=0.16.0
          curl -fsSL https://ziglang.org/download/index.json -o /tmp/zig-index.json
          url=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['$version']['x86_64-linux']['tarball'])")
          shasum=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['$version']['x86_64-linux']['shasum'])")
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "$shasum  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          zig version
          python3 --version

      # The auditor implements BLAKE3 against the PyPI package while the
      # library uses std.crypto.hash.Blake3, so a genuine disagreement between
      # the two implementations is what the audit is for. That makes the
      # package a hard requirement, not an optional extra: without it the
      # auditor exits 2 and `zig build verify` fails.
      #
      # Pinned so a new PyPI release cannot silently change the auditor. The
      # three attempts cover the runner images that mark the system
      # interpreter as externally managed (PEP 668); the import check below
      # fails the step loudly if none of them worked.
      - name: Python audit dependency
        run: |
          python3 -m pip install --disable-pip-version-check blake3==1.0.9 \
            || python3 -m pip install --disable-pip-version-check --break-system-packages blake3==1.0.9 \
            || python3 -m pip install --disable-pip-version-check --user blake3==1.0.9
          python3 -c "import blake3; print('blake3', blake3.__version__)"

      - name: Formatting
        run: zig build fmt

      - name: Unit tests
        run: zig build test --summary all

      - name: C ABI end to end
        run: zig build abi

      - name: Tests + ABI + independent Python audit
        run: zig build verify

      - name: FRI v2 audit
        run: zig build spike

      - name: vLLM ctypes adapter
        run: zig build vllm-adapter

      - name: The suite really ran
        run: |
          # A build step that silently runs zero tests would still be
          # green, so the count is asserted rather than trusted.
          zig build test --summary all 2>&1 | tee /tmp/summary.txt
          grep -Eq '[1-9][0-9]* tests? passed' /tmp/summary.txt
